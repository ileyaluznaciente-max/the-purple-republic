<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Observatory · The Purple Republic</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --p1:#0d0015;--p2:#130024;--p3:#1a0035;
  --pu:#7c3aed;--pm:#a855f7;--pl:#c084fc;--pg:#e9d5ff;
  --glow:0 0 20px rgba(168,85,247,0.5),0 0 60px rgba(124,58,237,0.3);
  --glow2:0 0 40px rgba(168,85,247,0.8),0 0 100px rgba(124,58,237,0.5);
  --glass:rgba(255,255,255,0.03);
  --glass-b:rgba(168,85,247,0.15);
}
html{scroll-behavior:smooth}
body{
  background:#09090f;color:#d8d9e8;font-family:'Inter',sans-serif;
  overflow-x:hidden;min-height:100vh;
}

/* ── CANVAS LAYERS ── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
#particle-canvas{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ambient light orbs */
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;animation:orbFloat 8s ease-in-out infinite}
.orb1{width:600px;height:600px;background:radial-gradient(circle,rgba(124,58,237,0.25),transparent 70%);top:-200px;left:-100px;animation-delay:0s}
.orb2{width:500px;height:500px;background:radial-gradient(circle,rgba(168,85,247,0.18),transparent 70%);top:40%;right:-150px;animation-delay:-3s}
.orb3{width:400px;height:400px;background:radial-gradient(circle,rgba(192,132,252,0.12),transparent 70%);bottom:-100px;left:30%;animation-delay:-6s}
.orb4{width:300px;height:300px;background:radial-gradient(circle,rgba(88,28,135,0.30),transparent 70%);top:60%;left:10%;animation-delay:-2s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.05)}66%{transform:translate(-20px,30px) scale(0.95)}}

/* ── LAYOUT ── */
.site{position:relative;z-index:2}

/* ── NAV ── */
nav{
  position:absolute;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;height:72px;
  background:linear-gradient(to bottom,rgba(13,0,21,0.55),rgba(13,0,21,0.0));
  backdrop-filter:none;
  border-bottom:none;
  box-shadow:none;
}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.nav-crown{
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;
  box-shadow:0 0 14px rgba(168,85,247,0.5);
}
.nav-crown img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.nav-title{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;color:#b0b3d6;letter-spacing:3px}
.nav-sub{font-size:9px;color:rgba(212,175,55,0.85);letter-spacing:2px}
.nav-link{
  padding:7px 14px;border-radius:20px;font-size:12px;color:rgba(176,179,214,0.55);
  background:transparent;border:none;cursor:pointer;transition:all .25s;letter-spacing:.3px;
}
.nav-link:hover,.nav-link.active{
  color:#e2e3f0;background:rgba(107,109,158,0.14);
  box-shadow:none;
}
.online-pill{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:20px;
  background:rgba(107,109,158,0.10);border:1px solid rgba(160,163,210,0.15);
  font-size:11px;color:rgba(176,179,214,0.65);
}
.pulse-dot{width:6px;height:6px;border-radius:50%;background:#8b8fc4;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(139,143,196,0.5)}70%{box-shadow:0 0 0 5px rgba(139,143,196,0)}}
.btn-join{
  padding:8px 20px;border-radius:20px;border:1px solid rgba(160,163,210,0.25);cursor:pointer;
  background:rgba(107,109,158,0.20);
  color:#e2e3f0;font-size:12px;font-weight:500;letter-spacing:.5px;
  box-shadow:none;transition:all .25s;position:relative;overflow:hidden;
}
.btn-join:hover{background:rgba(107,109,158,0.30);border-color:rgba(160,163,210,0.40)}

/* ── HERO ── */
.hero{
  
  min-height:100svh;
  min-height:100vh;
  display:flex;
  justify-content:center;text-align:center;padding:0 32px 60px;
  position:relative;overflow:hidden;
}
.hero-bg-img{
  position:absolute;inset:0;z-index:1;
  overflow:hidden;
}
.hero-bg-img img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center center;
  display:block;
}
.hero-overlay{display:none}
.hero-scanlines{display:none}
.hero-grid{display:none}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 18px;border-radius:30px;margin-bottom:28px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(10px);
  font-size:11px;color:rgba(255,255,255,0.75);letter-spacing:2px;text-transform:uppercase;
  box-shadow:none;
  animation:fadeDown .8s ease both;
}
.hero-title{
  font-family:'Orbitron',monospace;font-size:clamp(40px,7vw,88px);
  font-weight:900;line-height:1;margin-bottom:20px;
  background:linear-gradient(135deg,#ffffff 0%,#f0f0f0 50%,#cccccc 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:none;
  animation:fadeUp .8s .2s ease both;
}
.hero-title span{display:block}
.hero-subtitle{
  font-size:clamp(13px,1.5vw,16px);color:rgba(255,255,255,0.70);
  max-width:520px;margin:0 auto 40px;line-height:1.7;font-weight:300;
  animation:fadeUp .8s .4s ease both;
}
.hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:fadeUp .8s .6s ease both}
.cta-primary{
  padding:14px 32px;border-radius:30px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff;font-size:14px;font-weight:600;letter-spacing:.5px;
  box-shadow:var(--glow);transition:all .3s;position:relative;overflow:hidden;
}
.cta-primary:hover{box-shadow:var(--glow2);transform:translateY(-2px) scale(1.02)}
.cta-secondary{
  padding:14px 32px;border-radius:30px;cursor:pointer;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(168,85,247,0.35);
  color:#c084fc;font-size:14px;font-weight:500;letter-spacing:.3px;
  backdrop-filter:blur(10px);transition:all .3s;
}
.cta-secondary:hover{background:rgba(124,58,237,0.15);border-color:rgba(168,85,247,0.6);box-shadow:0 0 25px rgba(124,58,237,0.25)}
.hero-scroll{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:2px;animation:scrollBounce 2s infinite;
}
.hero-scroll::before{content:'';width:1px;height:40px;background:linear-gradient(transparent,rgba(255,255,255,0.25))}
@keyframes scrollBounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* ── STATS ── */
.stats-bar{
  display:flex;justify-content:center;gap:0;
  border-top:1px solid rgba(168,85,247,0.12);
  border-bottom:1px solid rgba(168,85,247,0.12);
  background:rgba(124,58,237,0.05);
  backdrop-filter:blur(20px);
}
.stat-item{
  flex:1;max-width:200px;text-align:center;padding:22px 16px;
  border-right:1px solid rgba(168,85,247,0.10);position:relative;
}
.stat-item:last-child{border-right:none}
.stat-item::after{
  content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:0;height:2px;background:var(--pm);transition:width .4s;
}
.stat-item:hover::after{width:60%}
.stat-num{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:#a855f7;text-shadow:0 0 15px rgba(168,85,247,0.6)}
.stat-label{font-size:10px;color:rgba(168,85,247,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:4px}

/* ── SECTION ── */
.section{padding:70px 40px;max-width:1200px;margin:0 auto}
.section-eyebrow{font-family:'Orbitron',monospace;font-size:10px;color:#7c3aed;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px}
.section-heading{font-size:clamp(22px,3vw,32px);font-weight:600;color:#e9d5ff;margin-bottom:36px;line-height:1.2}
.section-heading em{font-style:normal;color:#a855f7}

/* hero effects removed */
.hero-flags{display:none}
.palace-glow{display:none}
.crowd-lights{display:none}
.spark{display:none}
.lantern-glow{display:none}
.city-bg{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:0;
  background:url('city.jpg') center 60% / cover no-repeat;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none;
}
.city-bg.visible{opacity:1}
.city-bg-overlay{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(to bottom,
      #09090f 0%,
      #09090f 22%,
      rgba(9,9,15,0.30) 46%,
      rgba(9,9,15,0.18) 100%);
}

/* ── GLASS CARD ── */
.glass-card{
  background:linear-gradient(135deg,rgba(10,2,22,0.72),rgba(18,4,40,0.65));
  border:1px solid rgba(120,70,200,0.14);
  border-radius:20px;
  backdrop-filter:blur(28px) saturate(140%);
  transition:all .3s;
  position:relative;overflow:hidden;
}
.glass-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(140,80,220,0.30),transparent);
}
.glass-card:hover{
  border-color:rgba(140,80,220,0.28);
  background:linear-gradient(135deg,rgba(12,3,26,0.80),rgba(22,6,50,0.72));
  box-shadow:0 8px 40px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.05);
  transform:translateY(-3px);
}

/* ── MINISTRIES ── */
.ministries-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.ministry{padding:28px;cursor:pointer}
.ministry-holo{
  position:absolute;inset:0;border-radius:20px;
  background:conic-gradient(from 0deg,transparent 0%,rgba(168,85,247,0.08) 30%,rgba(192,132,252,0.05) 60%,transparent 100%);
  opacity:0;transition:opacity .3s;
  animation:holoSpin 6s linear infinite;
}
.ministry:hover .ministry-holo{opacity:1}
@keyframes holoSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.ministry-icon-wrap{
  width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:16px;position:relative;
  box-shadow:0 0 20px rgba(124,58,237,0.3);
}
.ministry-icon-wrap::after{
  content:'';position:absolute;inset:-1px;border-radius:15px;
  background:linear-gradient(135deg,rgba(168,85,247,0.4),transparent,rgba(124,58,237,0.2));
  z-index:-1;
}
.ministry-name{font-size:16px;font-weight:600;color:#ddd0f0;margin-bottom:8px}
.ministry-desc{font-size:12px;color:rgba(168,85,247,0.65);line-height:1.6}
.ministry-tag{
  display:inline-block;margin-top:14px;padding:3px 12px;border-radius:12px;
  font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  background:rgba(124,58,237,0.20);color:#a855f7;border:1px solid rgba(124,58,237,0.30);
}

/* ── MAIN LAYOUT ── */
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:24px;align-items:start}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}

/* ── FEED ── */
.feed-post{padding:20px;margin-bottom:16px;cursor:default}
.feed-post:hover{transform:translateY(-2px)}
.post-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.post-avatar{
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;border:1px solid rgba(168,85,247,0.30);
  box-shadow:0 0 12px rgba(124,58,237,0.25);
}
.post-name{font-size:13px;font-weight:600;color:#ddd0f0}
.post-badge{
  padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:.5px;
  margin-left:4px;
}
.badge-official{background:rgba(124,58,237,0.25);color:#c084fc;border:1px solid rgba(124,58,237,0.3)}
.badge-meme{background:rgba(245,158,11,0.15);color:#fbbf24;border:1px solid rgba(245,158,11,0.25)}
.badge-live{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}
.post-time{font-size:11px;color:rgba(124,58,237,0.5);margin-left:auto}
.post-body{font-size:13px;color:rgba(209,196,233,0.85);line-height:1.7;margin-bottom:14px}
.post-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.post-tag{font-size:11px;color:#7c3aed;transition:color .2s;cursor:pointer}
.post-tag:hover{color:#c084fc}
.post-actions{display:flex;gap:20px}
.post-action{
  display:flex;align-items:center;gap:5px;font-size:12px;color:rgba(124,58,237,0.6);
  background:none;border:none;cursor:pointer;transition:all .2s;padding:4px 8px;border-radius:8px;
}
.post-action:hover{color:#a855f7;background:rgba(124,58,237,0.12)}

/* ALERT */
.emergency{
  background:linear-gradient(135deg,rgba(127,29,29,0.35),rgba(88,15,15,0.20));
  border:1px solid rgba(248,113,113,0.25);
  border-radius:16px;padding:18px;display:flex;align-items:flex-start;gap:14px;
  margin-bottom:18px;backdrop-filter:blur(10px);position:relative;overflow:hidden;
}
.emergency::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(248,113,113,0.5),transparent);
}
.alert-title{font-size:11px;font-weight:700;color:#f87171;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.alert-body{font-size:12px;color:rgba(252,165,165,0.8);line-height:1.5}
.alert-btn{
  margin-top:10px;padding:5px 14px;
  background:rgba(239,68,68,0.20);border:1px solid rgba(239,68,68,0.35);
  border-radius:8px;color:#f87171;font-size:10px;font-weight:700;
  cursor:pointer;letter-spacing:1px;transition:all .2s;
}
.alert-btn:hover{background:rgba(239,68,68,0.30);box-shadow:0 0 15px rgba(239,68,68,0.2)}

/* ── SIDEBAR ── */
.sidebar-card{padding:20px;margin-bottom:16px}

/* Profile card */
.profile-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.profile-avatar{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 0 20px rgba(124,58,237,0.5);border:2px solid rgba(168,85,247,0.4);
  flex-shrink:0;
}
.profile-name{font-size:14px;font-weight:600;color:#e9d5ff}
.profile-bio{font-size:11px;color:rgba(168,85,247,0.6);margin-top:2px}
.profile-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:4px}
.pstat{
  text-align:center;padding:10px 6px;border-radius:12px;
  background:rgba(124,58,237,0.12);border:1px solid rgba(124,58,237,0.20);
}
.pstat-val{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:#a855f7}
.pstat-key{font-size:9px;color:rgba(124,58,237,0.6);letter-spacing:.5px;margin-top:2px}

/* XP bar */
.xp-bar{margin-top:12px}
.xp-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(168,85,247,0.6);margin-bottom:6px}
.xp-track{height:6px;background:rgba(124,58,237,0.15);border-radius:3px;overflow:hidden}
.xp-fill{height:100%;width:65%;background:linear-gradient(90deg,#7c3aed,#a855f7,#c084fc);border-radius:3px;position:relative;animation:xpGlow 2s ease-in-out infinite}
.xp-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:12px;background:rgba(255,255,255,0.4);filter:blur(4px)}
@keyframes xpGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

/* Checkin */
.streak-display{text-align:center;padding:12px 0}
.streak-flame{font-size:32px;display:block;animation:flamePulse 1.5s ease-in-out infinite}
@keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.streak-num{font-family:'Orbitron',monospace;font-size:36px;font-weight:900;color:#a855f7;text-shadow:0 0 20px rgba(168,85,247,0.8);display:block;line-height:1}
.streak-label{font-size:10px;color:rgba(168,85,247,0.5);letter-spacing:2px;text-transform:uppercase;margin-top:4px;display:block}
.btn-checkin{
  width:100%;padding:13px;border-radius:14px;border:none;cursor:pointer;
  background:linear-gradient(135deg,#6d28d9,#a855f7);
  color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;
  box-shadow:var(--glow);transition:all .3s;margin-top:12px;position:relative;overflow:hidden;
}
.btn-checkin::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-checkin:hover::after{opacity:1}
.btn-checkin:hover{box-shadow:var(--glow2)}
.btn-checkin:disabled{opacity:.4;cursor:not-allowed}

/* Missions */
.mission{
  display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;
  cursor:pointer;transition:all .2s;margin-bottom:4px;
}
.mission:hover{background:rgba(124,58,237,0.10)}
.mission-check{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  border:1.5px solid rgba(124,58,237,0.35);display:flex;align-items:center;justify-content:center;
  transition:all .3s;font-size:11px;
}
.mission-check.done{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:transparent;box-shadow:0 0 10px rgba(124,58,237,0.5)}
.mission-text{font-size:12px;color:rgba(209,196,233,0.85);flex:1}
.mission-pts{font-size:11px;color:#7c3aed;font-weight:600}
.missions-footer{font-size:10px;color:rgba(124,58,237,0.45);text-align:center;margin-top:10px;letter-spacing:.5px}

/* Poll */
.poll-q{font-size:13px;color:#ddd0f0;font-weight:500;margin-bottom:16px}
.poll-opt{margin-bottom:12px;cursor:pointer}
.poll-opt-label{display:flex;justify-content:space-between;font-size:12px;color:rgba(192,132,252,0.8);margin-bottom:6px}
.poll-track{height:8px;background:rgba(124,58,237,0.12);border-radius:4px;overflow:hidden;transition:all .2s}
.poll-opt:hover .poll-track{background:rgba(124,58,237,0.20)}
.poll-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#6d28d9,#a855f7,#c084fc);transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
.poll-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:4px;background:rgba(255,255,255,0.5);filter:blur(2px)}
.poll-voted{font-size:11px;color:#7c3aed;text-align:center;margin-top:10px;letter-spacing:.5px}

/* Sidebar label */
.sidebar-label{font-family:'Orbitron',monospace;font-size:10px;color:#7c3aed;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sidebar-label::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(124,58,237,0.3),transparent)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:28px;right:28px;z-index:9999;
  background:linear-gradient(135deg,rgba(88,28,135,0.95),rgba(107,33,168,0.95));
  border:1px solid rgba(168,85,247,0.5);border-radius:14px;
  padding:13px 22px;font-size:13px;font-weight:500;color:#e9d5ff;
  backdrop-filter:blur(20px);
  box-shadow:var(--glow),0 20px 60px rgba(0,0,0,0.5);
  transform:translateY(80px) scale(.95);opacity:0;
  transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;max-width:320px;
}
.toast.show{transform:translateY(0) scale(1);opacity:1}

/* ── FOOTER ── */
footer{
  border-top:1px solid rgba(124,58,237,0.15);padding:40px 32px;text-align:center;
  background:rgba(124,58,237,0.04);position:relative;overflow:hidden;
}
footer::before{

.muse-theater-card:hover .ministry-icon-wrap{
  box-shadow:0 0 36px rgba(192,132,252,0.50) !important;
}
.muse-theater-card:active{transform:translateY(-3px) scale(1.008) !important}

/* ── MUSE THEATER MODAL ── */
#muse-modal{
  position:fixed;inset:0;z-index:10000;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .45s ease;
}
#muse-modal.open{opacity:1;pointer-events:all}

#muse-backdrop{
  position:absolute;inset:0;
  background:rgba(4,2,12,0.85);
  backdrop-filter:blur(20px) saturate(140%);
  cursor:pointer;
}

#muse-panel{
  position:relative;z-index:1;
  width:min(920px,96vw);
  height:88vh;
  max-height:90vh;
  border-radius:24px;
  overflow:hidden;
  border:1px solid rgba(192,132,252,0.14);
  box-shadow:0 0 100px rgba(0,0,0,0.95), 0 0 50px rgba(124,58,237,0.08);
  transform:translateY(28px) scale(.97);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
}
#muse-modal.open #muse-panel{transform:translateY(0) scale(1)}

/* imagen como fondo absoluto — sin overlay agresivo */
#muse-hero{
  position:absolute;inset:0;
  width:100%;height:100%;
  overflow:hidden;
  z-index:0;
}
#muse-hero img{
  width:100%;height:100%;
  object-fit:cover;
  object-position:center 20%;
  display:block;
}
/* overlay muy suave — solo para que el texto inferior sea legible */
#muse-hero::after{
  content:'';
  position:absolute;inset:0;
  background:
    linear-gradient(to bottom,
      rgba(4,2,12,0.00) 0%,
      rgba(4,2,12,0.00) 35%,
      rgba(4,2,12,0.38) 62%,
      rgba(4,2,12,0.80) 100%);
  z-index:1;
}
/* corner decorativo superior izquierda — elegante */
#muse-hero::before{
  content:'';position:absolute;
  width:55px;height:55px;top:16px;left:16px;
  border:1px solid rgba(192,132,252,0.22);
  border-right:none;border-bottom:none;
  pointer-events:none;z-index:2;
}

/* contenido sobre la imagen */
#muse-content{
  position:relative;z-index:1;
  overflow-y:auto;
  overflow-x:hidden;
  flex:1;
  display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:rgba(168,85,247,0.25) transparent;
}
#muse-content::-webkit-scrollbar{width:3px}
#muse-content::-webkit-scrollbar-track{background:transparent}
#muse-content::-webkit-scrollbar-thumb{background:rgba(168,85,247,0.25);border-radius:2px}

/* zona de texto arriba — flota sobre la imagen */
.muse-text-zone{
  padding:48px 40px 0;
  background:transparent;
  min-height:52vh;
}
/* zona inferior con contenido — fluye naturalmente, scroll si supera el panel */
.muse-bottom-zone{
  padding:28px 40px 36px;
  background:linear-gradient(to top, rgba(4,2,12,0.92) 0%, rgba(4,2,12,0.60) 55%, transparent 100%);
}

/* eyebrow */
.muse-eyebrow{
  font-family:'Orbitron',monospace;font-size:9px;
  color:rgba(255,255,255,0.78);letter-spacing:4px;text-transform:uppercase;
  margin-bottom:10px;
  text-shadow:0 1px 10px rgba(0,0,0,0.9);
  text-align:center;
}
/* título principal */
.muse-title{
  font-family:'Orbitron',monospace;
  font-size:clamp(30px,5.5vw,58px);font-weight:900;
  line-height:1.0;margin-bottom:10px;
  background:linear-gradient(135deg,#ffffff 0%,#f0e6ff 30%,#c084fc 65%,rgba(124,58,237,0.85) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 18px rgba(168,85,247,0.8)) drop-shadow(0 0 40px rgba(124,58,237,0.5));
  animation:museTitleGlow 3.5s ease-in-out infinite;
}
@keyframes museTitleGlow{
  0%,100%{filter:drop-shadow(0 0 14px rgba(168,85,247,0.7)) drop-shadow(0 0 35px rgba(124,58,237,0.4))}
  50%{filter:drop-shadow(0 0 28px rgba(192,132,252,0.90)) drop-shadow(0 0 70px rgba(124,58,237,0.60))}
}
/* subtítulo */
.muse-subtitle{
  font-size:13px;color:rgba(255,255,255,0.72);
  max-width:520px;line-height:1.75;font-weight:300;margin-bottom:28px;
  text-shadow:0 1px 12px rgba(0,0,0,0.90);
}

/* divider */
.muse-divider{
  height:1px;margin:24px 0;
  background:linear-gradient(90deg, rgba(192,132,252,0.35), rgba(124,58,237,0.20), transparent);
}

/* ── STATS FLOTANTES — muy ligeras, sin fondo pesado ── */
.muse-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;margin-bottom:22px;
}
@media(max-width:600px){.muse-stats{grid-template-columns:repeat(2,1fr)}}
.muse-stat{
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(192,132,252,0.12);
  border-radius:12px;padding:10px 8px 11px;text-align:center;
  backdrop-filter:blur(8px) saturate(120%);
  -webkit-backdrop-filter:blur(8px) saturate(120%);
  box-shadow:inset 0 1px 0 rgba(192,132,252,0.10);
  transition:all .3s;position:relative;overflow:hidden;
}
.muse-stat::before{
  content:'';position:absolute;top:0;left:15%;right:15%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(192,132,252,0.50),transparent);
}
.muse-stat:hover{
  border-color:rgba(192,132,252,0.25);
  background:rgba(168,85,247,0.05);
  transform:translateY(-2px);
  box-shadow:0 0 16px rgba(168,85,247,0.10), inset 0 1px 0 rgba(192,132,252,0.18);
}
.muse-stat-icon{font-size:15px;display:block;margin-bottom:5px;opacity:0.88}
.muse-stat-n{
  font-family:'Orbitron',monospace;font-size:14px;font-weight:700;
  color:#e9d5ff;display:block;
  text-shadow:0 0 12px rgba(168,85,247,0.65);
  margin-bottom:3px;
}
.muse-stat-l{
  font-size:9px;color:rgba(192,132,252,0.45);
  letter-spacing:1.5px;text-transform:uppercase;display:block;
}

/* ── GALERÍA INFERIOR — tipo exhibition, sin cajas sólidas ── */
.muse-gallery-area{margin-top:4px}
.muse-gallery-title{
  font-family:'Orbitron',monospace;font-size:8px;
  color:rgba(192,132,252,0.35);letter-spacing:3px;text-transform:uppercase;
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.muse-gallery-title::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(192,132,252,0.12),transparent);
}
/* Cards de categoría de arte — flotantes, sin fondo sólido */
.muse-gallery-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
@media(max-width:600px){.muse-gallery-grid{grid-template-columns:repeat(2,1fr)}}
.muse-gallery-item{
  border:1px solid rgba(168,85,247,0.10);
  border-radius:10px;
  padding:14px 10px 12px;
  text-align:center;
  background:transparent;
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  transition:all .3s;
  cursor:pointer;
  position:relative;overflow:hidden;
}
.muse-gallery-item::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:linear-gradient(135deg,rgba(168,85,247,0.04) 0%,transparent 70%);
  pointer-events:none;
}
.muse-gallery-item:hover{
  border-color:rgba(192,132,252,0.28);
  background:rgba(168,85,247,0.05);
  transform:translateY(-3px);
  box-shadow:0 4px 20px rgba(0,0,0,0.35), 0 0 18px rgba(124,58,237,0.10);
}
.muse-gallery-icon{font-size:20px;display:block;margin-bottom:6px}
.muse-gallery-name{
  font-size:10px;font-weight:600;color:rgba(233,213,255,0.82);
  letter-spacing:.5px;display:block;margin-bottom:3px;
}
.muse-gallery-count{
  font-family:'Orbitron',monospace;font-size:10px;
  color:rgba(192,132,252,0.45);letter-spacing:1px;
}

/* close button */
#muse-close{
  position:absolute;top:14px;right:16px;z-index:20;
  width:36px;height:36px;border-radius:50%;border:1px solid rgba(192,132,252,0.20);
  background:rgba(4,2,12,0.65);backdrop-filter:blur(10px);
  color:rgba(192,132,252,0.60);font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
}
#muse-close:hover{
  border-color:rgba(192,132,252,0.50);color:#e9d5ff;
  box-shadow:0 0 18px rgba(168,85,247,0.25);
  background:rgba(88,28,135,0.35);
  transform:rotate(90deg) scale(1.1);
}

/* glow sutil inferior del panel */
#muse-glow-bottom{
  position:absolute;bottom:0;left:0;right:0;height:140px;
  background:radial-gradient(ellipse 65% 100% at 50% 100%,rgba(124,58,237,0.07),transparent);

}

.ga-stat-l,.dday-stat-l,.muse-stat-l{font-size:8px !important}

#monument-modal{
  position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
#monument-modal.open{opacity:1;pointer-events:all}
#monument-backdrop{position:absolute;inset:0;background:rgba(4,2,12,0.84);backdrop-filter:blur(18px) saturate(140%);cursor:pointer}
#monument-panel{
  position:relative;z-index:1;width:min(1380px,96vw);height:min(820px,92vh);overflow:hidden;border-radius:24px;
  border:1px solid rgba(216,180,254,0.16);box-shadow:0 38px 120px rgba(0,0,0,0.86),0 0 70px rgba(124,58,237,0.16);
  transform:translateY(24px) scale(.98);transition:transform .35s cubic-bezier(.16,1,.3,1);
}
#monument-modal.open #monument-panel{transform:translateY(0) scale(1)}
#monument-interior{position:absolute;inset:0;background:center / cover no-repeat}
#monument-interior::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(4,2,12,0.82) 0%,rgba(4,2,12,0.32) 30%,rgba(4,2,12,0.06) 63%,rgba(4,2,12,0.50) 100%),linear-gradient(0deg,rgba(4,2,12,0.74),transparent 46%);
}
#monument-close{
  position:absolute;top:16px;right:18px;z-index:4;width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(216,180,254,0.24);background:rgba(5,2,12,0.72);color:#e9d5ff;cursor:pointer;
}
.monument-modal-content{
  position:relative;z-index:2;height:100%;display:grid;grid-template-columns:minmax(230px,285px) 1fr;gap:22px;
  padding:clamp(24px,3vw,38px);
}
.monument-side-menu{
  align-self:stretch;background:linear-gradient(180deg,rgba(9,4,22,0.78),rgba(5,2,12,0.58));
  border:1px solid rgba(216,180,254,0.15);border-radius:16px;padding:18px;backdrop-filter:blur(18px);overflow:auto;
}
.monument-side-brand{font-family:'Orbitron',monospace;font-size:15px;color:#f5f0ff;margin-bottom:18px}
.monument-side-item{
  display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;min-height:54px;padding:10px;border-radius:10px;
  border:1px solid rgba(216,180,254,0.10);background:rgba(5,2,12,0.22);margin-bottom:8px;color:rgba(245,240,255,0.82);font-size:11px;
}
.monument-side-item small{display:block;color:rgba(216,180,254,0.48);font-size:9px;margin-top:2px}
.monument-modal-copy{align-self:start;justify-self:end;width:min(560px,72%);padding-top:6px}
.monument-modal-kicker{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(216,180,254,0.76);margin-bottom:12px}
.monument-modal-title{font-family:'Orbitron',monospace;font-size:clamp(28px,4.4vw,52px);line-height:1;color:#f5f0ff;margin-bottom:12px;text-shadow:0 0 34px rgba(168,85,247,0.46)}
.monument-modal-subtitle{font-size:12.5px;line-height:1.55;color:rgba(245,240,255,0.78);max-width:500px;margin-bottom:18px}
.monument-modal-stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(216,180,254,0.13);border-radius:12px;overflow:hidden;background:rgba(5,2,12,0.36);backdrop-filter:blur(12px)}
.monument-modal-stats span{padding:10px;border-right:1px solid rgba(216,180,254,0.09);font-size:8px;text-transform:uppercase;letter-spacing:.9px;color:rgba(216,180,254,0.58)}
.monument-modal-stats span:last-child{border-right:none}
.monument-modal-stats strong{display:block;font-family:'Orbitron',monospace;font-size:14px;color:#f5f0ff;margin-bottom:3px}
@media(max-width:820px){
  .monument-card{min-height:430px}
  .monument-card h3{font-size:clamp(28px,11vw,44px)}
  .monument-modal-content{grid-template-columns:1fr;overflow:auto;padding:64px 20px 24px}
  .monument-modal-copy{justify-self:start;width:100%}
  .monument-modal-stats{grid-template-columns:1fr}
  .monument-modal-stats span{border-right:none;border-bottom:1px solid rgba(216,180,254,0.09)}
  .monument-modal-stats span:last-child{border-bottom:none}
  #monument-panel{width:100vw;height:100vh;border-radius:0}
}

/* Ajuste fino: jerarquía más elegante y menos pesada */
.monument-card h3{font-size:clamp(26px,3.4vw,44px);line-height:1.02}
.monument-stats strong{font-size:12px}
.monument-stats span{font-size:8px;padding:9px 9px}
.ga-title,.dday-title,.muse-title,.monument-modal-title{font-size:clamp(26px,3.8vw,44px) !important}
.ga-stat-n,.dday-stat-n,.muse-stat-n,.monument-modal-stats strong{font-size:12px !important}
.ga-stat-l,.dday-stat-l,.muse-stat-l,.monument-modal-stats span{font-size:7.5px !important}

/* standalone page */
body{background:#09090f;color:#d8d9e8;font-family:'Inter',sans-serif;overflow-x:hidden;min-height:100vh;}
.site{position:relative;z-index:2}
</style>
</head>
<body>
<div class="site">
  <div class="section monuments-section" style="padding-top:60px">
    <div class="section-eyebrow">Lugares Legendarios</div>
    <div class="section-heading">Monumentos de la <em>República</em></div>
    <div class="monuments-showcase">
      <article class="monument-card monument-card--echo" onclick="openMonument()" title="Entrar a Echo Observatory">
      <div class="monument-card-scene monument-card-scene--echo"></div>
      <div class="monument-card-shade"></div>
      <div class="monument-card-copy">
        <div class="monument-kicker">Exterior · Cielo Abierto</div>
        <h3>Echo Observatory</h3>
        <p>Mirador nocturno para escuchar lo que la ciudad recuerda.</p>
        <div class="monument-stats">
          <span><strong>360°</strong> cielo</span>
          <span><strong>21K</strong> ecos</span>
          <span><strong>00:00</strong> peak</span>
        </div>
        <button class="monument-enter" type="button" onclick="event.stopPropagation();openMonument()">Entrar al observatorio <span>→</span></button>
      </div>
    </article>
    </div>
  </div>
</div>

<!-- ── MONUMENTOS ADICIONALES MODAL ── -->
<div id="monument-modal" role="dialog" aria-modal="true" aria-label="Monumento de la República">
  <div id="monument-backdrop" onclick="closeMonumentGallery()"></div>
  <div id="monument-panel">
    <div id="monument-interior"></div>
    <button id="monument-close" onclick="closeMonumentGallery()" aria-label="Cerrar">✕</button>
    <div class="monument-modal-content">
      <aside class="monument-side-menu">
        <div class="monument-side-brand" id="monument-side-brand">Monumento</div>
        <div id="monument-side-items"></div>
      </aside>
      <section class="monument-modal-copy">
        <div class="monument-modal-kicker" id="monument-modal-kicker">Interior · The Purple Republic</div>
        <div class="monument-modal-title" id="monument-modal-title">Monumento</div>
        <div class="monument-modal-subtitle" id="monument-modal-subtitle"></div>
        <div class="monument-modal-stats" id="monument-modal-stats"></div>
      </section>
    </div>
  </div>
</div>

<script>
function toast(msg){
  const t=document.getElementById('toastEl');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);
}
function openMonument(){
  document.getElementById('monument-interior').style.backgroundImage="url('echo_observatory_inside.png')";
  document.getElementById('monument-side-brand').textContent='Echo Observatory';
  document.getElementById('monument-modal-kicker').textContent='Interior · Cielo Abierto';
  document.getElementById('monument-modal-title').textContent='Echo Observatory';
  document.getElementById('monument-modal-subtitle').textContent='Un mirador suspendido sobre la ciudad violeta para estudiar ecos, señales y constelaciones.';
  document.getElementById('monument-modal-stats').innerHTML=`<span><strong>360°</strong>cielo</span><span><strong>21K</strong>ecos</span><span><strong>00:00</strong>peak</span>`;
  document.getElementById('monument-side-items').innerHTML=`<div class="monument-side-item"><span>◎</span><span>Sky Deck<small>Vista total</small></span></div><div class="monument-side-item"><span>✧</span><span>Signal Room<small>Ecos vivos</small></span></div><div class="monument-side-item"><span>⌁</span><span>Quiet Dome<small>Calma nocturna</small></span></div><div class="monument-side-item"><span>◇</span><span>Star Archive<small>Registros</small></span></div>`;
  document.getElementById('monument-modal').classList.add('open');
  document.body.style.overflow='hidden';
  toast('Bienvenida a Echo Observatory · The Purple Republic');
}
function closeMonumentGallery(){
  document.getElementById('monument-modal').classList.remove('open');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeMonumentGallery(); });
</script>

<div class="toast" id="toastEl"></div>
<script>
function toast(msg){
  const t=document.getElementById('toastEl');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);
}
</script>
</body>
</html>
